name: Release Docs

on:
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: pypythia-docs-gh-pages
  cancel-in-progress: false

env:
  DOC_VERSION: ${{ github.event.release.tag_name }}

jobs:
  release-docs:
    runs-on: ubuntu-latest
    steps:
    - name: Check out release
      uses: actions/checkout@v7
      with:
        ref: ${{ env.DOC_VERSION }}
        fetch-depth: 1

    - name: Set up Pixi
      uses: prefix-dev/setup-pixi@v0.10.2
      with:
        pixi-version: v0.76.1
        environments: docs
        cache: true
        locked: true

    - name: Validate documentation
      run: pixi run -e docs docs-build

    - name: Configure Git credentials
      run: |
        git config user.name github-actions[bot]
        git config user.email 41898282+github-actions[bot]@users.noreply.github.com

    - name: Fetch published documentation
      run: git fetch origin gh-pages:gh-pages --depth=1

    - name: Publish release documentation
      run: |
        pixi run -e docs mike deploy --update-aliases "$DOC_VERSION" latest
        pixi run -e docs mike set-default latest
        git push origin gh-pages
