name: Build and test PyPythia
run-name: Build and test the PyPythia Python library

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  pixi-tests:
    name: Pixi tests (${{ matrix.os }}, ${{ matrix.environment }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        environment: [py311, py314, legacy-raxml]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.77.0
          environments: ${{ matrix.environment }}
          frozen: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'master' }}
      - name: Check the lock file
        run: pixi lock --check
      - name: Run full test suite
        run: pixi run --frozen --environment ${{ matrix.environment }} test

  docs-check:
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.77.0
          environments: docs
          frozen: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'master' }}
      - name: Build documentation
        run: pixi run --frozen --environment docs docs-build

  package-smoke:
    name: Python package smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Set up LightGBM requirements
        uses: ./.github/actions/setup-lightgbm
      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install and verify the wheel
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          python -c "import pypythia"
          pythia --help
