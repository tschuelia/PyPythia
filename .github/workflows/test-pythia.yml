name: Build and test PyPythia
run-name: Build and test the PyPythia Python library

on:
  push:
    paths-ignore:
      - "docs/**"

jobs:
  pixi-tests:
    name: Pixi tests (${{ matrix.os }}, ${{ matrix.environment }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        environment: [py311, py314]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.77.0
          environments: ${{ matrix.environment }}
          frozen: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'master' }}
      - name: Check the lock file
        run: pixi lock --check
      - name: Run blocking core tests
        run: pixi run --frozen --environment ${{ matrix.environment }} test-core
      # Make this step blocking after PyPythia's RAxML-NG calls support version 2.x.
      - name: Run full RAxML-NG 2 compatibility suite
        continue-on-error: true
        run: pixi run --frozen --environment ${{ matrix.environment }} test

  package-smoke:
    name: Python package smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Set up LightGBM requirements
        uses: ./.github/actions/setup-lightgbm
      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install and verify the wheel
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          python -c "import pypythia"
          pythia --help
